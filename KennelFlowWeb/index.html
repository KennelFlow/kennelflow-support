<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>KennelFlow Web</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f3f6f2;color:#20372a}header{background:#173c2b;color:white;padding:18px 26px;display:flex;justify-content:space-between;align-items:center}h1{font-size:30px}main{max-width:1100px;margin:36px auto;padding:0 20px}.card{background:white;border:1px solid #dce5da;border-radius:14px;padding:22px;margin-bottom:18px}input,select,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #b7cbbd}button{cursor:pointer;background:#205d3d;color:white;border:0}button:disabled{opacity:.6}input{display:block;width:min(100%,400px);box-sizing:border-box;margin:8px 0 14px}#notice{color:#916124}#error{color:#a32b20}#list{display:grid;gap:10px}details{padding:13px;border:1px solid #e2e9e0;border-radius:9px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}nav button{background:#e2eee5;color:#17442c}nav button.active{background:#205d3d;color:white}#logout{background:#e3ece4;color:#173c2b}small{color:#617769}</style></head><body><header><strong>KennelFlow Web</strong><span>Existing KennelFlow cloud · Read-only</span></header><main><h1>Kennel Management</h1><p id="notice">Your existing kennel records remain unchanged. Sign in to view cloud data.</p><p id="error" role="alert"></p><section id="login" class="card"><h2>Sign in to KennelFlow</h2><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Sign in securely</button></form></section><section id="workspace" hidden><div class="card"><label>Current kennel <select id="kennel"></select></label> <button id="refresh">Refresh</button> <button id="logout">Sign out</button></div><nav id="nav"></nav><section class="card"><h2 id="sectionTitle">Overview</h2><small id="count"></small><div id="list"></div><button id="more" hidden>Load more</button></section></section><small>Live editing and automatic two-way sync are disabled until account, permission, and conflict testing is complete.</small></main><script src="/app.js" defer></script></body></html>
