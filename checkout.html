<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — KennelFlow Store</title><link rel="stylesheet" href="assets/styles.css"></head><body><div id="header"></div><main><section class="page-hero"><div class="container"><div class="kicker">Store Checkout</div><h1>Review your order.</h1><p class="lead">This Build 1 checkout collects order details locally for layout/testing. Live Square web checkout will be connected after product prices, shipping, and inventory are finalized.</p></div></section><section class="section"><div class="container grid-2"><div class="card"><h2>Order</h2><div id="checkout-items"></div><div class="cart-total" style="margin-top:18px"><span>Total</span><span id="checkout-total">$0.00</span></div></div><div class="card"><h2>Shipping Details</h2><form class="form-grid" onsubmit="event.preventDefault();alert('Checkout layout is working. Live Square payment processing will be connected in the next website store build.');"><div class="field"><label>First name</label><input required></div><div class="field"><label>Last name</label><input required></div><div class="field full"><label>Email</label><input type="email" required></div><div class="field full"><label>Address</label><input required></div><div class="field"><label>City</label><input required></div><div class="field"><label>State</label><input required></div><div class="field"><label>ZIP</label><input required></div><div class="field"><label>Country</label><input value="United States" required></div><div class="field full"><label>Order notes / kennel numbers for programming</label><textarea placeholder="Optional"></textarea></div><div class="field full"><button class="btn btn-primary" type="submit">Continue to Secure Checkout</button></div></form></div></div></section></main><div id="footer"></div><script src="assets/common.js"></script><script src="assets/site.js"></script><script>
document.getElementById('header').innerHTML=header();document.getElementById('footer').innerHTML=footer();
const cart=JSON.parse(localStorage.getItem('kfCheckoutCart')||localStorage.getItem('kfCart')||'{}');
const items=document.getElementById('checkout-items');let total=0;items.innerHTML=Object.entries(cart).map(([id,q])=>{const p=PRODUCTS[id];if(!p)return '';total+=p.price*q;return `<div class="cart-item"><div><strong>${p.name}</strong><br><small>Quantity ${q}</small></div><strong>$${(p.price*q).toFixed(2)}</strong></div>`}).join('')||'<p>Your cart is empty.</p>';document.getElementById('checkout-total').textContent=`$${total.toFixed(2)}`;
</script></body></html>
