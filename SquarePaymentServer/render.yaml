services:
  - type: web
    name: kennelflow-payments
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: SQUARE_ENVIRONMENT
        value: production
      - key: SQUARE_ACCESS_TOKEN
        sync: false
      - key: SQUARE_LOCATION_ID
        sync: false
      - key: MAX_PAYMENT_CENTS
        value: "5000000"
